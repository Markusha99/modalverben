<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grammatik-Trainer A1–B1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Golos+Text:wght@400;500;600;700&family=Jost:wght@500;600;700&display=swap">
<style>
/* Layout: one workbook column on squared paper (Karopapier). Home = catalogue of topics; lesson = grammar sheet + exercise sheets + result.
   Colour code everywhere: blue = the form to learn / verb position 2, amber = sentence end / second highlight. */
:root{
  --paper:#f3f6fb; --grid:#dde5f1; --sheet:#ffffff; --ink:#1a2340; --ink-soft:#56617c; --line:#ccd5e3;
  --blue:#1f3fbf; --blue-wash:#e7ecfc; --on-blue:#ffffff;
  --amber:#a85400; --amber-wash:#fdeeda;
  --ok:#157a46; --ok-wash:#e1f4e9; --bad:#c4252b; --bad-wash:#fde7e7; --note:#fff2a8; --note-ink:#3a3200;
  --sign-red:#c8102e; --sign-blue:#0b4ea2; --sign-white:#ffffff; --sign-black:#14161c;
  --f-display:"Jost","Century Gothic","Trebuchet MS",sans-serif;
  --f-body:"Golos Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11141c; --grid:#1b2130; --sheet:#191e2b; --ink:#e7ebf6; --ink-soft:#a2adc5; --line:#333c51;
    --blue:#93a9ff; --blue-wash:#222c54; --on-blue:#0d1230;
    --amber:#f2a955; --amber-wash:#3a2912;
    --ok:#62d293; --ok-wash:#143524; --bad:#ff8080; --bad-wash:#421b1f; --note:#4b4418; --note-ink:#fff6c4;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11141c; --grid:#1b2130; --sheet:#191e2b; --ink:#e7ebf6; --ink-soft:#a2adc5; --line:#333c51;
  --blue:#93a9ff; --blue-wash:#222c54; --on-blue:#0d1230;
  --amber:#f2a955; --amber-wash:#3a2912;
  --ok:#62d293; --ok-wash:#143524; --bad:#ff8080; --bad-wash:#421b1f; --note:#4b4418; --note-ink:#fff6c4;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:100%}
body{
  margin:0; background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:1.125rem; line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:1.5rem 1.5rem;
}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
a{color:var(--blue)}
.ua{color:var(--ink-soft);font-size:.9em}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:2px solid var(--blue)}
.top-in{max-width:62rem;margin:0 auto;padding:.5rem 1rem;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .75rem}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.2rem;letter-spacing:.01em;margin-right:auto;color:var(--ink);text-decoration:none}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:.75rem;color:var(--ink-soft)}
.nav{display:flex;flex-wrap:wrap;gap:.25rem}
.nav a,.nav span{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:.3rem .8rem;font-weight:600;font-size:.9rem;text-decoration:none;color:var(--ink)}
.nav a:hover{border-color:var(--blue);color:var(--blue)}
.nav span{opacity:.4}
.size{display:flex;gap:.25rem}
.size button{border:1px solid var(--line);background:var(--sheet);border-radius:6px;min-width:2.25rem;height:2.25rem;cursor:pointer;font-weight:700}

.wrap{max-width:62rem;margin:0 auto;padding-inline:1rem;padding-block:1.5rem 6rem;display:flex;flex-direction:column;gap:1.5rem}
.lead{display:flex;flex-direction:column;gap:.35rem;background:var(--sheet);border-left:6px solid var(--blue);padding:1rem 1.25rem}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.lead h1{font-size:clamp(1.6rem,4vw,2.4rem)}
.jump{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem}
.jump button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:.2rem .6rem;cursor:pointer;font-size:.85rem;font-weight:600;font-variant-numeric:tabular-nums}
.jump button.done{border-color:var(--amber);color:var(--amber);background:var(--amber-wash)}
.jump button.full{border-color:var(--ok);color:var(--ok);background:var(--ok-wash)}

/* home */
.filters{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:.5rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;align-self:flex-start}
.seg button{border:0;background:var(--sheet);padding:.35rem .9rem;cursor:pointer;font-weight:600;font-size:.95rem}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}
.search{flex:1 1 12rem;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--sheet);padding:.35rem .7rem}
.sec{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:1rem 1.25rem .5rem;display:flex;flex-direction:column;min-width:0}
.sec h2{font-size:1.25rem;margin-bottom:.4rem}
.lrow{display:grid;grid-template-columns:2.4rem minmax(0,1fr) auto;gap:.1rem .75rem;align-items:baseline;padding:.55rem 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.lrow:hover .lt{color:var(--blue)}
.ln{font-family:var(--f-display);font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.lt{font-weight:600}
.lt .ua{display:block;font-weight:400}
.lmeta{display:flex;gap:.5rem;align-items:center;font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.lv{font-family:var(--f-display);font-weight:700;font-size:.75rem;border:1.5px solid var(--ink-soft);color:var(--ink-soft);border-radius:999px;padding:0 .45rem}
.lv.A2{border-color:var(--blue);color:var(--blue)} .lv.B1{border-color:var(--amber);color:var(--amber)}
.prog{color:var(--ink-soft)} .prog.full{color:var(--ok);font-weight:700} .prog.part{color:var(--amber);font-weight:700}
@media (max-width:34rem){.lrow{grid-template-columns:2.4rem minmax(0,1fr)}.lmeta{grid-column:2}}

.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:1.25rem;display:flex;flex-direction:column;gap:1rem;min-width:0}
.sheet h2{font-size:1.35rem}
.scroll{overflow-x:auto;max-width:100%}

/* colour code */
.p2{color:var(--blue);font-weight:700}
.end{color:var(--amber);font-weight:700}

/* theory */
table{border-collapse:collapse}
.gt{min-width:min(100%,22rem)}
.gt th,.gt td{border:1px solid var(--line);padding:.4rem .65rem;text-align:left;vertical-align:top}
.gt thead th{background:var(--blue-wash);font-family:var(--f-display);font-weight:700}
.gt tbody th{font-weight:600;color:var(--ink-soft);background:var(--paper);white-space:nowrap}
.gt td.c-p2{background:var(--blue-wash)} .gt td.c-end{background:var(--amber-wash)}
.gt .gap{display:none}
.gt.train .form{display:none}
.gt.train .gap{display:inline-block}
.tr-bar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.rules{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:.5rem}
.rules .ua{display:block}
.bsp{display:flex;flex-direction:column;gap:.15rem;font-family:var(--f-hand);font-size:1.45rem;line-height:1.25;border-left:3px solid var(--line);padding-left:.8rem}

/* exercises */
.ex-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:.25rem .75rem}
.ex-nr{font-family:var(--f-display);font-weight:700;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--on-blue);background:var(--blue);padding:.15rem .6rem;border-radius:4px;white-space:nowrap}
.ex-head h3{font-size:1.2rem;flex:1 1 14rem;min-width:0}
.ex-head .ua{flex-basis:100%}
.ex-body{display:flex;flex-direction:column;gap:.6rem;min-width:0}
.ex-foot{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;border-top:1px dashed var(--line);padding-top:.9rem}
.btn{border:1.5px solid var(--line);background:var(--sheet);border-radius:8px;padding:.45rem 1rem;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink);display:inline-block}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn:hover{border-color:var(--blue)}
.btn.locked{color:var(--ink-soft)}
.score{font-weight:700;margin-left:auto;font-variant-numeric:tabular-nums}
.score.full{color:var(--ok)} .score.part{color:var(--amber)}
.lock{flex-basis:100%;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:.5rem .75rem}
.lock input{width:8rem;border:1.5px solid var(--line);border-radius:6px;background:var(--sheet);padding:.3rem .5rem;letter-spacing:.15em}
.lock .msg{color:var(--bad);font-weight:600;font-size:.9rem}
.bank{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;font-size:.95rem}
.bank b{font-weight:600;color:var(--ink-soft);margin-right:.25rem}
.bank span{border:1px solid var(--line);border-radius:4px;padding:.05rem .5rem;background:var(--paper);font-weight:600}

.gaptext{line-height:2.5}
.gaptext .n{font-weight:700;color:var(--blue)}
.gap{border:0;border-bottom:2px solid var(--ink-soft);background:var(--blue-wash);color:var(--blue);font-weight:700;text-align:center;border-radius:4px 4px 0 0;padding:.1rem .3rem;max-width:100%;line-height:1.3}
select.gap{text-align:left;padding:.15rem .2rem;cursor:pointer}
.gap.ok{background:var(--ok-wash);color:var(--ok);border-color:var(--ok)}
.gap.bad{background:var(--bad-wash);color:var(--bad);border-color:var(--bad)}
.gap.shown{background:var(--note);color:var(--note-ink);border-color:var(--ink-soft)}
.gnote{font-size:.8rem;color:var(--ink-soft);margin-left:.3rem;font-style:italic}
.gnote:empty{display:none}
.dl{display:grid;grid-template-columns:8.5rem minmax(0,1fr);gap:.5rem;line-height:2.5}
.sp{font-weight:700}
@media (max-width:36rem){.dl{grid-template-columns:1fr;gap:0}.dl .sp{line-height:1.4;margin-top:.5rem}}

/* gap table */
.gtab th,.gtab td{border:1px solid var(--line);padding:.35rem .6rem;text-align:left;white-space:nowrap}
.gtab thead th{background:var(--blue-wash);font-family:var(--f-display)}
.gtab tbody th{background:var(--paper);font-weight:600;color:var(--ink-soft)}

/* tick grid */
.grid th,.grid td{border:1px solid var(--line);padding:.3rem;text-align:center}
.grid thead th{font-family:var(--f-display);background:var(--blue-wash);padding:.4rem .6rem}
.grid tbody th{text-align:left;padding:.4rem .6rem;white-space:nowrap;background:var(--paper)}
.grid .rest{font-family:var(--f-hand);font-size:1.4rem;border:0;text-align:left;padding-left:1rem;white-space:nowrap}
.tick{width:2.4rem;height:2.1rem;border:1.5px solid var(--line);border-radius:6px;background:var(--sheet);cursor:pointer;font-weight:700;font-size:1.1rem;line-height:1;color:var(--blue)}
.tick[aria-pressed="true"]{background:var(--blue-wash);border-color:var(--blue)}
.tick.ok{background:var(--ok-wash);border-color:var(--ok);color:var(--ok)}
.tick.bad{background:var(--bad-wash);border-color:var(--bad);color:var(--bad)}
.tick.miss{border-style:dashed;border-color:var(--amber);color:var(--amber)}

/* word order */
.ord{display:flex;flex-direction:column;gap:.4rem;padding:.6rem 0;border-top:1px solid var(--line)}
.ord:first-child{border-top:0;padding-top:0}
.ord-line{display:flex;align-items:flex-end;gap:.5rem}
.ord-n{font-weight:700;color:var(--blue);min-width:1.4rem}
.ord-ans{flex:1;min-width:0;min-height:2.7rem;display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;border-bottom:2px solid var(--ink-soft);padding:.25rem}
.ord-ans.ok{border-color:var(--ok);background:var(--ok-wash)} .ord-ans.bad{border-color:var(--bad);background:var(--bad-wash)}
.ord-end{font-weight:700;font-size:1.3rem}
.ord-bank{display:flex;flex-wrap:wrap;gap:.35rem;min-height:2.3rem;padding-left:1.9rem}
.chip{border:1.5px solid var(--blue);background:var(--sheet);color:var(--blue);border-radius:6px;padding:.2rem .7rem;cursor:pointer;font-weight:600}
.ord-ans .chip{background:var(--blue-wash)}
.sol{font-family:var(--f-hand);font-size:1.4rem;color:var(--ink-soft);line-height:1.2}
.sol:empty{display:none}

/* sentence writing */
.wr{display:flex;flex-direction:column;gap:.3rem;padding:.6rem 0;border-top:1px solid var(--line)}
.wr:first-child{border-top:0;padding-top:0}
.wr input{width:100%;border:0;border-bottom:2px solid var(--ink-soft);background:var(--blue-wash);color:var(--blue);font-weight:600;padding:.35rem .5rem;border-radius:4px 4px 0 0}
.wr input.ok{background:var(--ok-wash);color:var(--ok);border-color:var(--ok)}
.wr input.bad{background:var(--bad-wash);color:var(--bad);border-color:var(--bad)}
.wr input.shown{background:var(--note);color:var(--note-ink)}

/* pick */
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));gap:.5rem}
.keys div{border:1px solid var(--line);border-radius:6px;padding:.4rem .7rem;background:var(--paper)}
.pick{display:inline-flex;gap:3px;vertical-align:middle;margin:0 .3rem}
.pick button{min-width:1.9rem;height:1.9rem;border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;cursor:pointer;font-weight:700;font-size:.9rem;line-height:1;color:var(--blue);padding:0 .5rem}
.pick button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.pick.ok button[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.pick.bad button[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.mk{line-height:2.5}
.mk .n{font-weight:700;color:var(--blue)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,17rem),1fr));gap:0 1.5rem}

/* match */
.match{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1rem 1.5rem;align-items:start}
@media (max-width:44rem){.match{grid-template-columns:1fr}}
.m-left{display:flex;flex-direction:column;gap:.1rem}
.m-row{display:flex;gap:.6rem;align-items:baseline;line-height:2.3}
.m-right{margin:0;padding:.6rem .9rem;list-style:none;border:1px solid var(--line);border-radius:6px;background:var(--paper);display:flex;flex-direction:column;gap:.3rem}
.m-right b{color:var(--blue);font-family:var(--f-display);margin-right:.5rem}

/* signs */
.signs{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.5rem,1fr));gap:.6rem}
.sign{display:flex;flex-direction:column;align-items:center;gap:.2rem;border:1px solid var(--line);border-radius:6px;padding:.5rem;background:var(--paper)}
.sign svg{width:4rem;height:4rem;display:block}
.sign b{font-family:var(--f-display);font-size:1rem}

.sticky-note{align-self:flex-start;background:var(--note);color:var(--note-ink);font-family:var(--f-hand);font-size:1.45rem;line-height:1.2;padding:.4rem .9rem;transform:rotate(-1deg)}

/* result */
.res{width:100%}
.res th,.res td{border-bottom:1px solid var(--line);padding:.4rem .5rem;text-align:left}
.res td:last-child,.res th:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.res tfoot td{font-weight:700;font-size:1.15rem;border-bottom:0;border-top:2px solid var(--ink)}
.name{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.name input{flex:1 1 14rem;min-width:0;border:0;border-bottom:2px solid var(--ink-soft);background:var(--blue-wash);padding:.35rem .5rem;font-family:var(--f-hand);font-size:1.5rem;color:var(--blue)}
.pager{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem}

/* umlaut keys */
.uml{position:fixed;right:.75rem;bottom:0;z-index:30;display:flex;gap:.3rem;background:var(--sheet);border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;padding:.4rem .5rem calc(.4rem + env(safe-area-inset-bottom,0px))}
.uml button{width:2.5rem;height:2.5rem;border:1.5px solid var(--blue);background:var(--blue-wash);color:var(--blue);border-radius:6px;font-weight:700;font-size:1.15rem;cursor:pointer}
.foot{font-size:.85rem;color:var(--ink-soft)}
@media (prefers-reduced-motion:no-preference){.chip,.tick,.btn{transition:background-color .12s,border-color .12s}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#">Grammatik-Trainer<small>Deutsch · A1–B1 · розроблено Красюком Дмитром Костянтиновичем</small></a>
    <nav class="nav" id="nav" aria-label="Навігація"></nav>
    <div class="size" aria-label="Розмір тексту">
      <button type="button" id="size-down" aria-label="Менший текст">A−</button>
      <button type="button" id="size-up" aria-label="Більший текст">A+</button>
    </div>
  </div>
</header>
<main class="wrap" id="view"></main>
<div class="uml" aria-label="Німецькі літери">
  <button type="button" data-ch="ä">ä</button><button type="button" data-ch="ö">ö</button><button type="button" data-ch="ü">ü</button><button type="button" data-ch="ß">ß</button>
</div>
<script>

function decode(b64){

function h53(str){
  var h1 = 0xdeadbeef ^ 7, h2 = 0x41c6ce57 ^ 7, i, ch;
  for (i = 0; i < str.length; i++){ ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);

function norm(s){
  return String(s).trim().toLowerCase().replace(/[’`´]/g,"'").replace(/\s+/g,' ').replace(/ae/g,'ä').replace(/oe/g,'ö').replace(/ue/g,'ü');
}
function normSent(s){
  return norm(String(s).replace(/[„“”"«»,;]/g,' ')).replace(/\s*[.?!…]+$/,'').replace(/\s+([?.!])/g,'$1');
}
function parse(text){
  var parts = [], re = /\{([^}]+)\}/g, last = 0, m;
  while ((m = re.exec(text))){
    if (m.index > last) parts.push(text.slice(last, m.index));
    parts.push({a: m[1].split('|')});
    last = re.lastIndex;
  }
  if (last < text.length) parts.push(text.slice(last));
  return parts;
}
function setVal(inp, v){ inp.value = v; if (inp.id && cur) cur.st.v[inp.id] = v; }

function makeGap(id, answers){
  var w = Math.max.apply(null, answers.map(function(a){return a.length})) + 2;
  var inp = el('input', {class:'gap', type:'text', id:id, autocomplete:'off', autocapitalize:'off', spellcheck:'false', 'aria-label':'Lücke', style:'width:' + Math.max(w, 4) + 'ch'});
  if (id) inp.value = cur.st.v[id] || '';
  return {inp:inp, note:el('span',{class:'gnote'}), answers:answers};
}
function makeSel(id, opts){
  var sel = el('select', {class:'gap', id:id, 'aria-label':'Auswahl'}, el('option', {value:''}, '…'));
  var seen = {}, list = opts.filter(function(o){ if (seen[o]) return false; seen[o] = 1; return true; });
  list.slice().sort(function(a, b){ return a.localeCompare(b, 'de'); }).forEach(function(o){ sel.append(el('option', {value:o}, o)); });
  sel.value = cur.st.v[id] || '';
  return {inp:sel, note:el('span',{class:'gnote'}), answers:[opts[0]], sel:true};
}
function normGap(s){ return norm(s).replace(/[.!?]+$/,'').trim(); }
function checkGap(g){
  var v = normGap(g.inp.value), i = -1, k;
  g.inp.classList.remove('ok','bad','shown'); g.note.textContent = '';
  for (k = 0; k < g.answers.length; k++) if (normGap(g.answers[k]) === v) { i = k; break; }
  if (!v || i < 0){ g.inp.classList.add('bad'); return false; }
  g.inp.classList.add('ok'); setVal(g.inp, g.answers[i]);
  if (g.answers.length > 1) g.note.textContent = 'auch: ' + g.answers.filter(function(_,j){return j!==i}).join(', ');
  return true;
}
function revealGap(g){
  g.inp.classList.remove('ok','bad'); g.inp.classList.add('shown'); setVal(g.inp, g.answers[0]);
  g.note.textContent = g.answers.length > 1 ? 'auch: ' + g.answers.slice(1).join(', ') : '';
}
function resetGap(g){ g.inp.classList.remove('ok','bad','shown'); setVal(g.inp, ''); g.note.textContent = ''; }
function gapApi(gaps){
  return {
    check: function(){ var c = 0; gaps.forEach(function(g){ if (checkGap(g)) c++; }); return {c:c, t:gaps.length}; },
    reveal: function(){ gaps.forEach(revealGap); },
    reset: function(){ gaps.forEach(resetGap); }
  };
}
function fill(box, text, id, gaps){
  parse(text).forEach(function(p){
    if (typeof p === 'string') { addHtml(box, fmt(p)); return; }
    var gid = id + '-g' + gaps.length, g;
    if (p.a[0].charAt(0) === '='){ p.a[0] = p.a[0].slice(1); g = makeSel(gid, p.a); }
    else g = makeGap(gid, p.a);
    gaps.push(g); box.append(g.inp, g.note);
  });
}

var BUILD = {};

BUILD.gap = function(body, ctx){
  var gaps = [], x = ctx.x;
  x.items.forEach(function(t, n){
    var m = t.split(' :: '), p;
    if (m.length === 2){
      var tx = el('span', {class:'tx'});
      fill(tx, m[1], ctx.id, gaps);
      p = el('p', {class:'dl'}, el('span', {class:'sp'}, m[0] + ':'), tx);
    } else {
      p = el('p', {class:'gaptext'});
      if (x.num) p.append(el('span', {class:'n'}, (n + 1) + '. '));
      fill(p, t, ctx.id, gaps);
    }
    body.append(p);
  });
  return gapApi(gaps);
};

BUILD.gtab = function(body, ctx){
  var gaps = [], x = ctx.x, table = el('table', {class:'gtab'});
  if (x.head){ var hr = el('tr'); x.head.forEach(function(h){ hr.append(el('th', {html:fmt(h)})); }); table.append(el('thead', {}, hr)); }
  var tb = el('tbody');
  x.rows.forEach(function(r){
    var tr = el('tr');
    r.forEach(function(c, ci){ var cell = el(ci === 0 ? 'th' : 'td'); fill(cell, c, ctx.id, gaps); tr.append(cell); });
    tb.append(tr);
  });
  table.append(tb);
  body.append(el('div', {class:'scroll'}, table));
  return gapApi(gaps);
};

BUILD.grid = function(body, ctx){
  var x = ctx.x, st = ctx.w, cells = [];
  var table = el('table', {class:'grid'});
  var hr = el('tr', {}, el('th', {}));
  x.cols.forEach(function(c){ hr.append(el('th', {}, c)); });
  if (x.rest) hr.append(el('th', {class:'rest'}));
  table.append(el('thead', {}, hr));
  var tb = el('tbody');
  x.rows.forEach(function(r, ri){
    var tr = el('tr', {}, el('th', {scope:'row'}, r[0]));
    cells[ri] = [];
    x.cols.forEach(function(c, ci){
      var k = ri + '-' + ci;
      var b = el('button', {class:'tick', type:'button', 'aria-pressed': st[k] ? 'true' : 'false', 'aria-label': r[0] + ' ' + c});
      b.textContent = st[k] ? '✗' : '';
      b.addEventListener('click', function(){
        var on = b.getAttribute('aria-pressed') !== 'true';
        b.setAttribute('aria-pressed', String(on)); b.textContent = on ? '✗' : '';
        b.classList.remove('ok','bad','miss');
        if (on) st[k] = 1; else delete st[k];
        save();
      });
      cells[ri][ci] = b;
      tr.append(el('td', {}, b));
    });
    if (x.rest && ri === 0) tr.append(el('td', {class:'rest', rowspan:x.rows.length}, x.rest));
    tb.append(tr);
  });
  table.append(tb);
  body.append(el('div', {class:'scroll'}, table));
  function paint(reveal){
    var good = 0;
    x.rows.forEach(function(r, ri){
      var rowOk = true;
      cells[ri].forEach(function(b, ci){
        var want = r[1].indexOf(ci) >= 0, k = ri + '-' + ci;
        b.classList.remove('ok','bad','miss');
        if (reveal){
          b.setAttribute('aria-pressed', String(want)); b.textContent = want ? '✗' : '';
          if (want) st[k] = 1; else delete st[k];
          return;
        }
        var has = b.getAttribute('aria-pressed') === 'true';
        if (has && want) b.classList.add('ok');
        else if (has && !want) { b.classList.add('bad'); rowOk = false; }
        else if (!has && want) { b.classList.add('miss'); rowOk = false; }
      });
      if (rowOk) good++;
    });
    return {c:good, t:x.rows.length};
  }
  return {
    check: function(){ return paint(false); },
    reveal: function(){ paint(true); },
    reset: function(){ cells.forEach(function(row){ row.forEach(function(b){ b.setAttribute('aria-pressed','false'); b.textContent=''; b.classList.remove('ok','bad','miss'); }); }); for (var k in st) delete st[k]; }
  };
};

function chipsOf(s){

  }

  var msg = el('span', {class:'msg'});

  var bRev = el('button', {class:'btn b-rev' + (unlocked[n] ? '' : ' locked'), type:'button'}, unlocked[n] ? 'Показати відповіді' : 'Показати відповіді · код');

    score.className = 'score'; score.textContent = 'Відповіді показано'; refresh();
  }
  function tryCode(){
    var c = code.value.trim();
    if (h53(n + ':' + c) === HASH[n] || h53('m:' + c) === HASH.m){
      unlocked[n] = 1; code.value = ''; msg.textContent = '';

    bRev,
    el('button', {class:'btn', type:'button', onclick:function(){
      api.reset(); delete st.s[i]; if (st.r) delete st.r[i]; save(); score.className = 'score'; score.textContent = ''; refresh();
    }}, 'Скинути'),
    score, lock);
  host.append(head, body, foot);
  if (st.s[i]) show(st.s[i]);
  cur.ex.push({host:host, api:api, x:x, clear:function(){ api.reset(); score.className = 'score'; score.textContent = ''; }});

}

      if (filt.lv && m.lv !== filt.lv) return;
      if (q && (m.t + ' ' + m.ua + ' ' + m.sec + ' ' + m.n).toLowerCase().indexOf(q) < 0) return;
      if (!map[m.sec]) { map[m.sec] = []; secs.push(m.sec); }
      map[m.sec].push(m);
    });
    if (!secs.length) list.append(el('p', {class:'sheet'}, 'Нічого не знайдено. Спробуй інше слово.'));
    secs.forEach(function(s){
      var box = el('section', {class:'sec'}, el('h2', {}, s));
      map[s].forEach(function(m){
        box.append(el('a', {class:'lrow', href:'#lektion-' + m.n},
          el('span', {class:'ln'}, m.n),
          el('span', {class:'lt'}, m.t, el('span', {class:'ua'}, m.ua)),
          el('span', {class:'lmeta'}, el('span', {class:'lv ' + m.lv}, m.lv), progress(m))));
      });
      list.append(box);
    });
  }
  draw();
}

function route(){
  var m = /^#lektion-(\d+)$/.exec(location.hash || '');
  if (m && byN[+m[1]]) openLesson(+m[1]); else home();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

/* persist typed values; clear stale marks while editing */
document.addEventListener('input', function(e){
  var t = e.target;
  if (!cur || !t.id || t.hasAttribute('data-nosave') || !/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName)) return;
  t.classList.remove('ok','bad','shown');
  cur.st.v[t.id] = t.value; save();
});

/* text size */
var SIZES = [100, 112.5, 125, 140];
function size(i){ saved.size = Math.max(0, Math.min(SIZES.length - 1, i)); document.documentElement.style.fontSize = SIZES[saved.size] + '%'; save(); }
$('#size-down').addEventListener('click', function(){ size((saved.size || 0) - 1); });
$('#size-up').addEventListener('click', function(){ size((saved.size || 0) + 1); });
size(saved.size || 0);

/* umlaut keys type into the field that had focus last */
var lastField = null;
document.addEventListener('focusin', function(e){
  var t = e.target;
  if ((t.tagName === 'INPUT' && (t.type === 'text' || t.type === 'search')) || t.tagName === 'TEXTAREA') lastField = t;
});
$$('.uml button').forEach(function(b){
  b.addEventListener('pointerdown', function(e){ e.preventDefault(); });
  b.addEventListener('click', function(){
    var f = lastField; if (!f || !f.isConnected) return;
    var s = f.selectionStart == null ? f.value.length : f.selectionStart, e2 = f.selectionEnd == null ? s : f.selectionEnd;
    f.value = f.value.slice(0, s) + b.getAttribute('data-ch') + f.value.slice(e2);
    f.focus(); try { f.setSelectionRange(s + 1, s + 1); } catch (err) {}
    f.dispatchEvent(new Event('input', {bubbles:true}));
  });
});

route();
})();
</script>
</body>
